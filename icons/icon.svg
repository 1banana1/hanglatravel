      <stop offset="0" stop-color="#1b1f26"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="86" fill="none" stroke="#2a2f36" stroke-width="6"/>
  <!-- 金色「夯」块 -->
  <rect x="72" y="186" width="150" height="140" rx="22" fill="#e6b422"/>
  <text x="147" y="286" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"
