  <!-- 箭头 -->
  <path d="M246 256 h40" stroke="#9aa3ad" stroke-width="14" stroke-linecap="round"/>
  <path d="M274 234 l26 22 -26 22" fill="none" stroke="#9aa3ad" stroke-width="14"
